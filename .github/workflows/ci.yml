name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - billing-service
          - hosting-service
          - domain-service
          - support-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint + unit tests (Dockerfile "test" stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.service }}.Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  manifests:
    name: validate kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
      - name: Render and validate
        run: |
          cp infrastructure/k8s/secrets.env.example infrastructure/k8s/secrets.env
          ./kustomize build infrastructure/k8s > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml

  publish:
    name: publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - auth-service
          - billing-service
          - hosting-service
          - domain-service
          - support-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.service }}.Dockerfile
          target: runtime
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/xosting-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/xosting-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
