# Database migrations run as one-off Jobs before the new Deployments roll out.
# Jobs are immutable: `make deploy-k8s` deletes the previous ones first.
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migrate
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/shamshodbekdev/xosting-auth-service:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: { name: xosting-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: AUTH_DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: JWT_SECRET } }
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: AUTH_DJANGO_SECRET_KEY } }
            - name: INTERNAL_API_TOKEN
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: INTERNAL_API_TOKEN } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: billing-service-migrate
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/shamshodbekdev/xosting-billing-service:latest
          command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_plans"]
          envFrom:
            - configMapRef: { name: xosting-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: BILLING_DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: JWT_SECRET } }
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: BILLING_DJANGO_SECRET_KEY } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
