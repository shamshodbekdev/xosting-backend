apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-worker
  labels:
    app.kubernetes.io/name: billing-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: billing-worker }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-worker
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: billing-worker }
      containers:
        - name: billing-worker
          image: ghcr.io/shamshodbekdev/xosting-billing-service:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "--loglevel", "INFO", "--concurrency", "4"]
          envFrom:
            - configMapRef: { name: xosting-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: BILLING_DATABASE_URL } }
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: BILLING_DJANGO_SECRET_KEY } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: JWT_SECRET } }
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A config inspect ping -d celery@$HOSTNAME --timeout 10"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give endpoints/ingress time to stop routing before SIGTERM.
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
