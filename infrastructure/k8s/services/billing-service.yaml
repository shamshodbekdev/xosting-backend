apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: billing-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: billing-service }
      containers:
        - name: billing-service
          image: ghcr.io/shamshodbekdev/xosting-billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: xosting-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: BILLING_DATABASE_URL } }
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: BILLING_DJANGO_SECRET_KEY } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: xosting-secrets, key: JWT_SECRET } }
            - { name: PROMETHEUS_MULTIPROC_DIR, value: "/tmp" }
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give endpoints/ingress time to stop routing before SIGTERM.
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  labels: { app.kubernetes.io/name: billing-service }
spec:
  selector: { app.kubernetes.io/name: billing-service }
  ports:
    - { name: http, port: 8000, targetPort: http }
