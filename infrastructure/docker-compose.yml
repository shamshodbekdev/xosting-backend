# Local development stack for xosting.net.
#
#   make up        # build + start everything (reads ../.env)
#   make migrate   # apply database migrations and seed plans
#   make logs      # follow logs
#
# Public entry point: http://localhost:${GATEWAY_PORT:-8080}  (api-gateway)
# Mail catcher UI:    http://localhost:8025                    (mailpit)
# Optional observability profile (Prometheus + Jaeger):
#   docker compose --profile observability up -d

name: xosting

x-python-service: &python-service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [backend]

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_URL: redis://redis:6379/0
  EVENTS_STREAM: ${EVENTS_STREAM:-xosting.events}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_ISSUER: ${JWT_ISSUER:-xosting-auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-xosting-api}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  # ---------------------------------------------------------------- data stores
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?}
      HOSTING_DB_PASSWORD: ${HOSTING_DB_PASSWORD:?}
      DOMAIN_DB_PASSWORD: ${DOMAIN_DB_PASSWORD:?}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.21.0
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    networks: [backend]

  # ------------------------------------------------------------------- services
  auth-service:
    <<: *python-service
    build: { context: .., dockerfile: infrastructure/docker/auth-service.Dockerfile, target: runtime }
    image: ${REGISTRY:-ghcr.io/shamshodbekdev}/xosting-auth-service:${TAG:-latest}
    environment:
      <<: *common-env
      DJANGO_SECRET_KEY: ${AUTH_DJANGO_SECRET_KEY:?}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,auth-service,billing-service}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgres://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

  billing-service: &billing
    <<: *python-service
    build: { context: .., dockerfile: infrastructure/docker/billing-service.Dockerfile, target: runtime }
    image: ${REGISTRY:-ghcr.io/shamshodbekdev}/xosting-billing-service:${TAG:-latest}
    environment: &billing-env
      <<: *common-env
      DJANGO_SECRET_KEY: ${BILLING_DJANGO_SECRET_KEY:?}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,auth-service,billing-service}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgres://billing_user:${BILLING_DB_PASSWORD}@postgres:5432/billing_db
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      BILLING_CURRENCY: ${BILLING_CURRENCY:-UZS}
      BILLING_INVOICE_DUE_DAYS: ${BILLING_INVOICE_DUE_DAYS:-3}
      BILLING_RENEWAL_LEAD_DAYS: ${BILLING_RENEWAL_LEAD_DAYS:-7}
      BILLING_SUSPEND_GRACE_DAYS: ${BILLING_SUSPEND_GRACE_DAYS:-5}
      PAYMENTS_PUBLIC_BASE_URL: ${PAYMENTS_PUBLIC_BASE_URL:-http://localhost:8080}
      PAYMENTS_RETURN_URL: ${PAYMENTS_RETURN_URL:-http://localhost:3000/billing/invoices}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

  billing-worker:
    <<: *billing
    command: ["celery", "-A", "config", "worker", "--loglevel", "INFO", "--concurrency", "4"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3

  billing-beat:
    <<: *billing
    command: ["celery", "-A", "config", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }

  hosting-service:
    <<: *python-service
    build: { context: .., dockerfile: infrastructure/docker/hosting-service.Dockerfile, target: runtime }
    image: ${REGISTRY:-ghcr.io/shamshodbekdev}/xosting-hosting-service:${TAG:-latest}
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://hosting_user:${HOSTING_DB_PASSWORD}@postgres:5432/hosting_db
      ISPMANAGER_URL: ${ISPMANAGER_URL:?}
      ISPMANAGER_USERNAME: ${ISPMANAGER_USERNAME:?}
      ISPMANAGER_PASSWORD: ${ISPMANAGER_PASSWORD:?}
      ISPMANAGER_VERIFY_TLS: ${ISPMANAGER_VERIFY_TLS:-true}
      HOSTING_SERVER_NAME: ${HOSTING_SERVER_NAME:-web-01.xosting.net}
      HOSTING_PLAN_PRESETS: ${HOSTING_PLAN_PRESETS:-}

  domain-service:
    <<: *python-service
    build: { context: .., dockerfile: infrastructure/docker/domain-service.Dockerfile, target: runtime }
    image: ${REGISTRY:-ghcr.io/shamshodbekdev}/xosting-domain-service:${TAG:-latest}
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://domain_user:${DOMAIN_DB_PASSWORD}@postgres:5432/domain_db
      RDAP_BASE_URL: ${RDAP_BASE_URL:-https://rdap.org}

  support-service:
    <<: *python-service
    build: { context: .., dockerfile: infrastructure/docker/support-service.Dockerfile, target: runtime }
    image: ${REGISTRY:-ghcr.io/shamshodbekdev}/xosting-support-service:${TAG:-latest}
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://support_user:${SUPPORT_DB_PASSWORD}@postgres:5432/support_db

  notification-service:
    build: { context: .., dockerfile: infrastructure/docker/notification-service.Dockerfile, target: runtime }
    image: ${REGISTRY:-ghcr.io/shamshodbekdev}/xosting-notification-service:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      EVENTS_STREAM: ${EVENTS_STREAM:-xosting.events}
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-xosting.net <no-reply@xosting.net>}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [backend]

  api-gateway:
    build: { context: .., dockerfile: infrastructure/docker/api-gateway.Dockerfile, target: runtime }
    image: ${REGISTRY:-ghcr.io/shamshodbekdev}/xosting-api-gateway:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      billing-service: { condition: service_healthy }
      hosting-service: { condition: service_healthy }
      domain-service: { condition: service_healthy }
      support-service: { condition: service_healthy }
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/3
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ISSUER: ${JWT_ISSUER:-xosting-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-xosting-api}
      AUTH_SERVICE_URL: http://auth-service:8000
      BILLING_SERVICE_URL: http://billing-service:8000
      HOSTING_SERVICE_URL: http://hosting-service:8000
      DOMAIN_SERVICE_URL: http://domain-service:8000
      SUPPORT_SERVICE_URL: http://support-service:8000
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-300}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    networks: [backend]

  # ------------------------------------------------- observability (optional)
  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [observability]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
