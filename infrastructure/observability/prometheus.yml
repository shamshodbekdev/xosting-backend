global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: xosting-python
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8000
          - billing-service:8000
          - hosting-service:8000
          - domain-service:8000
          - support-service:8000

  - job_name: xosting-go
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8080
          - notification-service:8090
